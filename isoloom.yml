# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Unicornel (Google's 2024 security competition, by Google; a pwn challenge) as an Isoloom spec:
# a multi-process emulator on the Unicorn engine with hand-written syscalls.
# The challenge folder 2024/quals/pwn-unicornel of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2024-unicornel

networks:
  lab: { cidr: 10.60.180.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    docker:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the emulator greets the player
    script: checks/probe.sh
    wait: 60

message: |
  Unicornel (Google, 2024) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  The emulator implements its own syscalls: read them for a shared resource that is not checked twice.
